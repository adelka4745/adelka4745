name: Deploy static content to Pages

on:
  # Запускается при пуше в ветку master или main. 
  # Если у тебя ветка называется по-другому, поменяй тут.
  push:
    branches: ["master", "main"]

  # Позволяет запустить процесс вручную из вкладки Actions
  workflow_dispatch:

# Права доступа для деплоя
permissions:
  contents: read
  pages: write
  id-token: write

# Разрешаем только один одновременный деплой
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Загружаем весь репозиторий
          path: '.'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
